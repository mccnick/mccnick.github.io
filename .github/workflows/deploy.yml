name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Runs only when pushing to main branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18  # Matches your current setup

      - name: Install Dependencies
        run: npm install --legacy-peer-deps  # Fixes dependency conflicts

      - name: Build Project
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3  # Updated to v3
        with:
          path: ./build  # Path to your build output

  deploy:
    needs: build  # Ensures the build job completes before deploying
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4  # Updated to v4